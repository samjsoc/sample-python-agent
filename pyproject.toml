[project]
name = "python-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "amp-instrumentation>=0.4.1",
    "fastapi>=0.143.0",
    "pydantic-ai>=2.55.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
python-agent = "python_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
